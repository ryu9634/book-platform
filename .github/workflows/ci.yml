# 두 서비스를 따로 빌드하고 테스트합니다. 통합 테스트는 Testcontainers로 Oracle 컨테이너를 띄웁니다(러너에 Docker 있음).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [library-loan-service, ebook-commerce-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Oracle 이미지를 미리 받아 두면 테스트 중 컨테이너 시작 대기 시간 초과를 줄일 수 있습니다.
      - name: Pull Oracle image
        run: docker pull gvenzl/oracle-free:23-slim

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/*/build/reports/tests/test
          retention-days: 7

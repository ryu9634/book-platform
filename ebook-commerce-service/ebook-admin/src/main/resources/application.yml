spring:
  application:
    name: ebook-admin
  servlet:
    multipart:
      # 본문 파일 최대 크기(ebook.storage.max-file-size)보다 조금 크게 둡니다. 정확한 검사는 저장소가 합니다.
      max-file-size: 6MB
      max-request-size: 7MB
  config:
    import: classpath:application-core.yml
  profiles:
    default: local

server:
  port: 9082

# 첫 관리자 계정. 값은 환경 변수로만 넣습니다. 비어 있으면 계정을 만들지 않습니다.
ebook:
  # 정기 작업 (관리자 앱에서만 실행)
  schedule:
    enabled: true
    pending-order-cancel-cron: "0 */10 * * * *"  # 10분마다
    pending-order-timeout: 30m
  admin:
    initial-login-id: ${EBOOK_ADMIN_LOGIN_ID:}
    initial-password: ${EBOOK_ADMIN_PASSWORD:}

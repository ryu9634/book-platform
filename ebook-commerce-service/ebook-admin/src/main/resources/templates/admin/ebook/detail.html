<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>전자책 상세</title>
</head>
<body>
<section layout:fragment="content" class="medium">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <div class="title-row">
        <h1 th:text="${ebook.title()}">제목</h1>
        <a class="button" th:href="@{/admin/ebooks/{id}/edit(id=${ebook.id()})}">수정</a>
    </div>
    <img th:if="${ebook.coverImageUrl()}" th:src="${ebook.coverImageUrl()}" alt="표지" class="cover">
    <dl class="detail">
        <dt>저자</dt><dd th:text="${ebook.author()}">저자</dd>
        <dt>출판사</dt><dd th:text="${ebook.publisher()} ?: '-'">출판사</dd>
        <dt>가격</dt><dd th:text="|정가 ${#numbers.formatInteger(ebook.price(), 1, 'COMMA')}원 / 판매가 ${#numbers.formatInteger(ebook.salePrice(), 1, 'COMMA')}원 (${ebook.discountRate()}% 할인)|">가격</dd>
        <dt>분류</dt><dd th:text="${ebook.categoryName()} ?: '-'">분류</dd>
        <dt>상태</dt><dd th:text="${ebook.statusLabel()}">판매 중</dd>
        <dt>판매 수</dt><dd th:text="${ebook.salesCount()}">0</dd>
        <dt>본문</dt><dd th:text="${ebook.hasFile()} ? |${ebook.pageCount()}쪽| : '아직 없음'">없음</dd>
    </dl>
    <h2>판매 상태</h2>
    <form th:each="s : ${ {'ON_SALE','STOP_SALE','HIDDEN'} }" th:if="${ebook.status().name() != s}"
          th:action="@{/admin/ebooks/{id}/status(id=${ebook.id()})}" method="post" class="inline">
        <input type="hidden" name="status" th:value="${s}">
        <button type="submit" class="link" th:text="${s == 'ON_SALE' ? '판매 시작' : (s == 'STOP_SALE' ? '판매 중지' : '숨기기')}">변경</button>
    </form>
    <h2>본문 파일</h2>
    <form th:action="@{/admin/ebooks/{id}/file(id=${ebook.id()})}" method="post" enctype="multipart/form-data" class="search">
        <input type="file" name="file" accept=".txt" required>
        <button type="submit">올리기</button>
    </form>
    <p class="hint">UTF-8 텍스트(.txt) 파일만, 5MB까지. 1,500자마다 한 쪽으로 나눕니다.</p>
    <a th:href="@{/admin/ebooks}">목록으로</a>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>전자책 관리</title>
</head>
<body>
<section layout:fragment="content">
    <div class="title-row">
        <h1>전자책 관리</h1>
        <a class="button" th:href="@{/admin/ebooks/new}">전자책 등록</a>
    </div>
    <form th:action="@{/admin/ebooks}" method="get" class="search">
        <select name="status">
            <option value="">전체 상태</option>
            <option value="ON_SALE" th:selected="${status != null and status.name() == 'ON_SALE'}">판매 중</option>
            <option value="STOP_SALE" th:selected="${status != null and status.name() == 'STOP_SALE'}">판매 중지</option>
            <option value="HIDDEN" th:selected="${status != null and status.name() == 'HIDDEN'}">숨김</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="제목, 저자">
        <button type="submit">검색</button>
    </form>
    <p th:if="${page.totalElements == 0}">등록된 전자책이 없습니다.</p>
    <table th:unless="${page.totalElements == 0}" class="table">
        <thead><tr><th>ID</th><th>제목</th><th>저자</th><th>판매가</th><th>상태</th><th>판매 수</th><th>본문</th></tr></thead>
        <tbody>
        <tr th:each="e : ${page.content}">
            <td th:text="${e.id()}">1</td>
            <td><a th:href="@{/admin/ebooks/{id}(id=${e.id()})}" th:text="${e.title()}">제목</a></td>
            <td th:text="${e.author()}">저자</td>
            <td th:text="|${#numbers.formatInteger(e.salePrice(), 1, 'COMMA')}원|">0원</td>
            <td th:text="${e.statusLabel()}">판매 중</td>
            <td th:text="${e.salesCount()}">0</td>
            <td th:text="${e.hasFile()} ? |${e.pageCount()}쪽| : '없음'">없음</td>
        </tr>
        </tbody>
    </table>
    <nav class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/admin/ebooks(page=${page.number - 1}, status=${status}, keyword=${keyword})}">이전</a>
        <span th:text="|${page.number + 1} / ${page.totalPages}|">1 / 1</span>
        <a th:if="${page.hasNext()}" th:href="@{/admin/ebooks(page=${page.number + 1}, status=${status}, keyword=${keyword})}">다음</a>
    </nav>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${reading.title()}">뷰어</title>
</head>
<body>
<section layout:fragment="content" class="medium">
    <div class="title-row">
        <h1 th:text="${reading.title()}">제목</h1>
        <a th:href="@{/bookshelf}">내 서재</a>
    </div>
    <article class="viewer" th:text="${reading.content()}">본문</article>
    <nav class="pager">
        <a th:if="${reading.hasPrevious()}" th:href="@{/bookshelf/{id}/read(id=${reading.bookshelfId()}, page=${reading.page() - 1})}">이전 쪽</a>
        <span th:text="|${reading.page()} / ${reading.totalPages()}|">1 / 10</span>
        <a th:if="${reading.hasNext()}" th:href="@{/bookshelf/{id}/read(id=${reading.bookshelfId()}, page=${reading.page() + 1})}">다음 쪽</a>
    </nav>
</section>
</body>
</html>

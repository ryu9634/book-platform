<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${ebook.title()}">전자책 상세</title>
</head>
<body>
<section layout:fragment="content" class="medium">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <h1 th:text="${ebook.title()}">제목</h1>
    <img th:if="${ebook.coverImageUrl()}" th:src="${ebook.coverImageUrl()}" alt="표지" class="cover">
    <dl class="detail">
        <dt>저자</dt><dd th:text="${ebook.author()}">저자</dd>
        <dt>출판사</dt><dd th:text="${ebook.publisher()} ?: '-'">출판사</dd>
        <dt>분류</dt><dd th:text="${ebook.categoryName()} ?: '-'">분류</dd>
        <dt>쪽수</dt><dd th:text="${ebook.pageCount()} != null ? |${ebook.pageCount()}쪽| : '-'">-</dd>
        <dt>가격</dt>
        <dd>
            <span class="strike" th:if="${ebook.discountRate() > 0}" th:text="|${#numbers.formatInteger(ebook.price(), 1, 'COMMA')}원|">10,000원</span>
            <strong th:text="|${#numbers.formatInteger(ebook.salePrice(), 1, 'COMMA')}원|">9,000원</strong>
            <span class="discount" th:if="${ebook.discountRate() > 0}" th:text="|${ebook.discountRate()}% 할인|">10% 할인</span>
        </dd>
    </dl>
    <div class="actions" id="ebook-actions">
        <p th:unless="${ebook.onSale()}" class="alert">판매 중지된 도서입니다. 이미 구매하신 분은 내 서재에서 읽을 수 있습니다.</p>
        <a th:if="${ebook.onSale() and loginName == null}" class="button" th:href="@{/login}">로그인 후 구매</a>
        <a th:if="${purchase == 'OWNED'}" class="button" th:href="@{/bookshelf}">서재에서 읽기</a>
        <a th:if="${purchase == 'IN_CART' and ebook.onSale()}" class="button secondary" th:href="@{/cart}">장바구니 보기</a>
        <th:block th:if="${purchase == 'CAN_PURCHASE' and ebook.onSale()}">
            <form th:action="@{/cart/items}" method="post" class="inline">
                <input type="hidden" name="ebookId" th:value="${ebook.id()}">
                <button type="submit" class="button secondary">장바구니 담기</button>
            </form>
            <a class="button" th:href="@{/orders/checkout(ebookIds=${ebook.id()})}">바로 구매</a>
        </th:block>
    </div>
    <p class="description" th:if="${ebook.description()}" th:text="${ebook.description()}">소개</p>
    <a th:href="@{/ebooks}">목록으로</a>
</section>
</body>
</html>

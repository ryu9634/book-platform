<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>홈</title>
</head>
<body>
<section layout:fragment="content">
    <form th:action="@{/ebooks}" method="get" class="search">
        <input type="text" name="keyword" placeholder="제목이나 저자로 검색">
        <button type="submit">검색</button>
    </form>
    <h2>베스트셀러</h2>
    <p th:if="${#lists.isEmpty(bestsellers)}">아직 판매 중인 전자책이 없습니다.</p>
    <ul class="cards">
        <th:block th:each="ebook : ${bestsellers}">
            <li th:replace="~{fragments/ebook-card :: card(${ebook})}"></li>
        </th:block>
    </ul>
    <h2>신간</h2>
    <ul class="cards">
        <th:block th:each="ebook : ${newArrivals}">
            <li th:replace="~{fragments/ebook-card :: card(${ebook})}"></li>
        </th:block>
    </ul>
</section>
</body>
</html>

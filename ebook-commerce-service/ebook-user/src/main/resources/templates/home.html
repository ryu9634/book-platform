<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>홈</title>
</head>
<body>
<section layout:fragment="content">
    <div class="hero">
        <h1>오늘 읽을 전자책을 찾아보세요</h1>
        <p>구매한 책은 내 서재에서 바로 읽을 수 있습니다.</p>
        <form th:action="@{/ebooks}" method="get" class="search">
            <input type="text" name="keyword" placeholder="제목이나 저자로 검색">
            <button type="submit">검색</button>
        </form>
    </div>
    <h2>베스트셀러</h2>
    <p th:if="${#lists.isEmpty(bestsellers)}">아직 판매 중인 전자책이 없습니다.</p>
    <ul class="cards">
        <th:block th:each="ebook : ${bestsellers}">
            <li th:replace="~{fragments/ebook-card :: card(${ebook})}"></li>
        </th:block>
    </ul>
    <th:block th:unless="${#lists.isEmpty(fromLibrary)}">
        <h2>도서관에서 많이 빌린 책, 전자책으로</h2>
        <ul class="cards">
            <th:block th:each="ebook : ${fromLibrary}">
                <li th:replace="~{fragments/ebook-card :: card(${ebook})}"></li>
            </th:block>
        </ul>
    </th:block>
    <h2>신간</h2>
    <ul class="cards">
        <th:block th:each="ebook : ${newArrivals}">
            <li th:replace="~{fragments/ebook-card :: card(${ebook})}"></li>
        </th:block>
    </ul>
</section>
</body>
</html>

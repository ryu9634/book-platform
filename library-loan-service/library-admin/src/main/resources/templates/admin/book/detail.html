<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>도서 상세</title>
</head>
<body>
<section layout:fragment="content" class="medium">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <div class="title-row">
        <h1 th:text="${book.title}">제목</h1>
        <a class="button" th:href="@{/admin/books/{id}/edit(id=${book.id})}">수정</a>
    </div>
    <img th:if="${book.coverImageUrl}" th:src="${book.coverImageUrl}" alt="표지" class="cover">
    <dl class="detail">
        <dt>저자</dt><dd th:text="${book.author}">저자</dd>
        <dt>출판사</dt><dd th:text="${book.publisher} ?: '-'">출판사</dd>
        <dt>출판일</dt><dd th:text="${book.publishedDate} ?: '-'">출판일</dd>
        <dt>분류</dt><dd th:text="${book.categoryName} ?: '-'">분류</dd>
        <dt>ISBN</dt><dd th:text="${book.isbn}">ISBN</dd>
    </dl>
    <p class="description" th:if="${book.description}" th:text="${book.description}">소개</p>
    <h2>소장 자료</h2>
    <form th:action="@{/admin/books/{id}/copies(id=${book.id})}" method="post" class="search">
        <input type="number" name="quantity" value="1" min="1" max="10">
        <button type="submit">권 추가</button>
    </form>
    <p th:if="${#lists.isEmpty(copies)}">등록된 소장 자료가 없습니다.</p>
    <table th:unless="${#lists.isEmpty(copies)}" class="table">
        <thead><tr><th>바코드</th><th>상태</th><th>변경</th></tr></thead>
        <tbody>
        <tr th:each="copy : ${copies}">
            <td th:text="${copy.barcode}">LIB-000001-001</td>
            <td th:text="${copy.statusLabel()}">대출 가능</td>
            <td>
                <!-- 지금 상태에서 할 수 있는 변경만 버튼으로 보여 줍니다. 허용 여부는 서버(엔티티)가 다시 확인합니다. -->
                <form th:each="action : ${ {'LOST','FOUND','DISCARD'} }"
                      th:if="${(action == 'LOST' and copy.status.name() == 'AVAILABLE')
                              or (action == 'FOUND' and copy.status.name() == 'LOST')
                              or (action == 'DISCARD' and (copy.status.name() == 'AVAILABLE' or copy.status.name() == 'LOST'))}"
                      th:action="@{/admin/books/copies/{id}/status(id=${copy.id})}" method="post" class="inline">
                    <input type="hidden" name="bookId" th:value="${book.id}">
                    <input type="hidden" name="action" th:value="${action}">
                    <button type="submit" class="link"
                            th:text="${action == 'LOST' ? '분실' : (action == 'FOUND' ? '찾음' : '폐기')}">분실</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/admin/books}">목록으로</a>
</section>
</body>
</html>

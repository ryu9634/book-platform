<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>도서 관리</title>
</head>
<body>
<section layout:fragment="content">
    <div class="title-row">
        <h1>도서 관리</h1>
        <a class="button" th:href="@{/admin/books/new}">도서 등록</a>
    </div>
    <form th:action="@{/admin/books}" method="get" class="search">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="제목 검색">
        <button type="submit">검색</button>
    </form>
    <p th:if="${page.totalElements == 0}">등록된 도서가 없습니다.</p>
    <table th:unless="${page.totalElements == 0}" class="table">
        <thead>
        <tr><th>ID</th><th>제목</th><th>저자</th><th>출판사</th><th>분류</th><th>ISBN</th></tr>
        </thead>
        <tbody>
        <tr th:each="book : ${page.content}">
            <td th:text="${book.id}">1</td>
            <td><a th:href="@{/admin/books/{id}(id=${book.id})}" th:text="${book.title}">제목</a></td>
            <td th:text="${book.author}">저자</td>
            <td th:text="${book.publisher}">출판사</td>
            <td th:text="${book.categoryName} ?: '-'">분류</td>
            <td th:text="${book.isbn}">ISBN</td>
        </tr>
        </tbody>
    </table>
    <nav class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/admin/books(page=${page.number - 1}, keyword=${keyword})}">이전</a>
        <span th:text="|${page.number + 1} / ${page.totalPages}|">1 / 1</span>
        <a th:if="${page.hasNext()}" th:href="@{/admin/books(page=${page.number + 1}, keyword=${keyword})}">다음</a>
    </nav>
</section>
</body>
</html>

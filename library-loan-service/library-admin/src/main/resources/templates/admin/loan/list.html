<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>대출 현황</title>
</head>
<body>
<section layout:fragment="content">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <div class="title-row">
        <h1>대출 현황</h1>
        <a th:href="@{/admin/loans/overdue}">연체 현황</a>
    </div>
    <form th:action="@{/admin/loans}" method="get" class="search">
        <select name="filter">
            <option value="ACTIVE" th:selected="${filter == 'ACTIVE'}">대출 중</option>
            <option value="RETURNED" th:selected="${filter == 'RETURNED'}">반납 완료</option>
            <option value="ALL" th:selected="${filter == 'ALL'}">전체</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="회원 아이디·이름, 도서 제목, 바코드">
        <button type="submit">검색</button>
    </form>
    <p th:if="${page.totalElements == 0}">대출 기록이 없습니다.</p>
    <table th:unless="${page.totalElements == 0}" class="table">
        <thead><tr><th>회원</th><th>도서</th><th>바코드</th><th>대출일</th><th>반납 예정일</th><th>상태</th><th></th></tr></thead>
        <tbody>
        <tr th:each="loan : ${page.content}">
            <td th:text="|${loan.memberName()} (${loan.loginId()})|">회원</td>
            <td th:text="${loan.title()}">제목</td>
            <td th:text="${loan.barcode()}">LIB-000001-001</td>
            <td th:text="${#temporals.format(loan.loanedAt(), 'yyyy-MM-dd')}">2026-11-04</td>
            <td th:text="${loan.dueDate()}">2026-11-18</td>
            <td th:text="${loan.status().name() == 'RETURNED'} ? '반납 완료' : (${loan.isOverdue(today)} ? '연체' : '대출 중')">대출 중</td>
            <td>
                <form th:if="${loan.status().name() != 'RETURNED'}" th:action="@{/admin/loans/{id}/return(id=${loan.loanId()})}" method="post" class="inline">
                    <button type="submit" class="link">데스크 반납</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <nav class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/admin/loans(page=${page.number - 1}, filter=${filter}, keyword=${keyword})}">이전</a>
        <span th:text="|${page.number + 1} / ${page.totalPages}|">1 / 1</span>
        <a th:if="${page.hasNext()}" th:href="@{/admin/loans(page=${page.number + 1}, filter=${filter}, keyword=${keyword})}">다음</a>
    </nav>
</section>
</body>
</html>

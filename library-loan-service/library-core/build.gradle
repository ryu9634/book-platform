// 엔티티, Repository, 두 앱이 함께 쓰는 도메인 규칙, 공통 설정, Flyway 마이그레이션.
// 실행 가능한 앱이 아니므로 Spring Boot 플러그인을 적용하지 않고 일반 jar로 만듭니다.
plugins {
	id 'java-library'
	id 'java-test-fixtures'
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-oracle'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	// 비밀번호 해시(BCrypt)는 user, admin 앱이 함께 쓰므로 core에 둡니다. 웹 보안 기능은 포함하지 않습니다.
	api 'org.springframework.security:spring-security-crypto'

	// 두 앱이 함께 쓰는 API 예외 처리(GlobalExceptionHandler)만 Spring MVC에 의존합니다. 실제 라이브러리는 앱이 제공합니다.
	compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// API 인증 실패를 ApiResponse JSON으로 바꾸는 핸들러(ApiSecurityErrorHandler)만 Spring Security에 의존합니다.
	compileOnly 'org.springframework.boot:spring-boot-starter-security'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'

	// user, admin 모듈 테스트에서도 같은 Oracle 컨테이너 설정을 쓰도록 testFixtures로 공유합니다.
	testFixturesApi 'org.springframework.boot:spring-boot-test'
	testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
	testFixturesApi 'org.testcontainers:testcontainers-junit-jupiter'
	testFixturesApi 'org.testcontainers:testcontainers-oracle-free'
}

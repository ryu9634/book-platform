<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${book.title}">도서 상세</title>
</head>
<body>
<section layout:fragment="content" class="medium">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <h1 th:text="${book.title}">제목</h1>
    <img th:if="${book.coverImageUrl}" th:src="${book.coverImageUrl}" alt="표지" class="cover">
    <dl class="detail">
        <dt>저자</dt><dd th:text="${book.author}">저자</dd>
        <dt>출판사</dt><dd th:text="${book.publisher} ?: '-'">출판사</dd>
        <dt>출판일</dt><dd th:text="${book.publishedDate} ?: '-'">출판일</dd>
        <dt>분류</dt><dd th:text="${book.categoryName} ?: '-'">분류</dd>
        <dt>ISBN</dt><dd th:text="${book.isbn}">ISBN</dd>
    </dl>
    <p class="description" th:if="${book.description}" th:text="${book.description}">소개</p>

    <div class="actions" id="book-actions">
        <a th:if="${loginName == null}" class="button" th:href="@{/login}">로그인 후 대출 가능</a>
        <th:block th:if="${action != null}" th:switch="${action.type().name()}">
            <form th:case="'CAN_LOAN'" th:action="@{/loans}" method="post" class="inline">
                <input type="hidden" name="bookId" th:value="${book.id}">
                <button type="submit" class="button">대출하기</button>
            </form>
            <form th:case="'RESERVED_READY'" th:action="@{/loans}" method="post" class="inline">
                <input type="hidden" name="bookId" th:value="${book.id}">
                <button type="submit" class="button">예약 도서 대출하기</button>
                <span class="muted">예약하신 도서를 보관 중입니다.</span>
            </form>
            <a th:case="'ALREADY_LOANED'" class="button secondary" th:href="@{/loans/my}">대출 중 - 내 대출에서 확인</a>
            <a th:case="'RESERVED_WAITING'" class="button secondary" th:href="@{/reservations/my}"
               th:text="|예약 ${action.waitingPosition()}번째 대기 중|">예약 대기 중</a>
            <form th:case="'NO_AVAILABLE_COPY'" th:action="@{/reservations}" method="post" class="inline">
                <input type="hidden" name="bookId" th:value="${book.id}">
                <button type="submit" class="button">예약하기</button>
                <span class="muted">지금은 모든 권이 대출 중입니다.</span>
            </form>
            <span th:case="'SUSPENDED'" class="alert error" th:text="|대출 정지 중 (${action.suspendedUntil()}까지)|">대출 정지 중</span>
        </th:block>
    </div>

    <h2 th:text="|소장 자료 (대출 가능 ${book.availableCount()} / ${#lists.size(book.copies)})|">소장 자료</h2>
    <p th:if="${#lists.isEmpty(book.copies)}">소장 자료가 없습니다.</p>
    <table th:unless="${#lists.isEmpty(book.copies)}" class="table">
        <thead><tr><th>바코드</th><th>상태</th></tr></thead>
        <tbody>
        <tr th:each="copy : ${book.copies}">
            <td th:text="${copy.barcode}">LIB-000001-001</td>
            <td th:text="${copy.statusLabel()}">대출 가능</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/books}">목록으로</a>
</section>
</body>
</html>

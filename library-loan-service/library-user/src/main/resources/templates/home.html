<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>홈</title>
</head>
<body>
<section layout:fragment="content">
    <h1>도서관에 오신 것을 환영합니다</h1>
    <p th:if="${loginName != null}" th:text="|${loginName}님, 로그인되었습니다.|">로그인되었습니다.</p>
    <form th:action="@{/books}" method="get" class="search">
        <input type="text" name="keyword" placeholder="제목이나 저자로 검색">
        <button type="submit">검색</button>
    </form>
    <h2>신착 도서</h2>
    <p th:if="${#lists.isEmpty(newArrivals)}">아직 등록된 도서가 없습니다.</p>
    <ul class="cards">
        <!-- th:replace가 th:each보다 먼저 실행되므로 반복은 바깥 블록에 둡니다. -->
        <th:block th:each="book : ${newArrivals}">
            <li th:replace="~{fragments/book-card :: card(${book})}"></li>
        </th:block>
    </ul>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>내 대출</title>
</head>
<body>
<section layout:fragment="content">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <div class="title-row">
        <h1>내 대출</h1>
        <a th:href="@{/loans/my/history}">전체 대출 이력</a>
    </div>
    <p th:if="${#lists.isEmpty(loans)}">대출 중인 도서가 없습니다. <a th:href="@{/books}">도서 검색</a></p>
    <table th:unless="${#lists.isEmpty(loans)}" class="table">
        <thead><tr><th>도서</th><th>바코드</th><th>대출일</th><th>반납 예정일</th><th>상태</th><th></th></tr></thead>
        <tbody>
        <tr th:each="loan : ${loans}" th:classappend="${loan.overdue()} ? 'overdue'">
            <td><a th:href="@{/books/{id}(id=${loan.bookId()})}" th:text="${loan.title()}">제목</a></td>
            <td th:text="${loan.barcode()}">LIB-000001-001</td>
            <td th:text="${#temporals.format(loan.loanedAt(), 'yyyy-MM-dd')}">2026-11-04</td>
            <td th:text="${loan.dueDate()}">2026-11-18</td>
            <td th:text="${loan.statusLabel()}">대출 중</td>
            <td class="row-actions">
                <form th:action="@{/loans/{id}/extend(id=${loan.loanId()})}" method="post" class="inline"
                      th:if="${!loan.overdue() and loan.extendCount() == 0}">
                    <button type="submit" class="link">연장</button>
                </form>
                <form th:action="@{/loans/{id}/return(id=${loan.loanId()})}" method="post" class="inline">
                    <button type="submit" class="link">반납</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

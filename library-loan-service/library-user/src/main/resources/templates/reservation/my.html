<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>내 예약</title>
</head>
<body>
<section layout:fragment="content">
    <p th:if="${message}" class="alert" th:text="${message}">처리 결과</p>
    <p th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">오류</p>
    <h1>내 예약</h1>
    <p th:if="${#lists.isEmpty(reservations)}">진행 중인 예약이 없습니다.</p>
    <table th:unless="${#lists.isEmpty(reservations)}" class="table">
        <thead><tr><th>도서</th><th>예약일</th><th>상태</th><th>수령 기한</th><th></th></tr></thead>
        <tbody>
        <tr th:each="r : ${reservations}">
            <td><a th:href="@{/books/{id}(id=${r.bookId()})}" th:text="${r.title()}">제목</a></td>
            <td th:text="${#temporals.format(r.reservedAt(), 'yyyy-MM-dd')}">2026-11-04</td>
            <td th:text="${r.statusLabel()}">1번째 대기 중</td>
            <td th:text="${r.expiresAt() != null} ? ${#temporals.format(r.expiresAt(), 'yyyy-MM-dd HH:mm')} : '-'">-</td>
            <td>
                <a th:if="${r.status().name() == 'NOTIFIED'}" th:href="@{/books/{id}(id=${r.bookId()})}">대출하러 가기</a>
                <form th:action="@{/reservations/{id}/cancel(id=${r.reservationId()})}" method="post" class="inline">
                    <button type="submit" class="link">취소</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
